# How mod-owned core shaders are handled while an Iris shader pack is active.
#
# overlay      draws land in a private target composited over the finished frame. Mod shaders
#              always show up exactly as authored and the pack cannot black them out, but they
#              receive no pack lighting. Shaders that leave fragColor.a undefined can come out
#              wrong here, since compositing needs alpha to mean coverage.
# lit          draws land in the pack's albedo target with depth writes suppressed, so the
#              pack's deferred pass lights them using the surface behind. Mod geometry picks up
#              shadows, lighting, fog and tonemapping. Best for anything drawn on a world
#              surface; anything floating against the sky comes out dark.
# iris_default no target handling, just Iris's own behaviour with unknown shaders unmasked.
mode = overlay

# Cancels Iris's color and depth mask kill for shaders it does not recognise. With this off,
# mod shaders are invisible no matter what mode is selected.
forceAllowUnknownShaders = true
